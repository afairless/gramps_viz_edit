name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        include:
          - name: "Default (5.2)"
            features: ""
          - name: "All schemas"
            features: "--all-features"
          - name: "Single 5.1"
            features: "--no-default-features --features schema-5-1"
          - name: "Single 5.2"
            features: "--no-default-features --features schema-5-2"
      fail-fast: false

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Run tests (${{ matrix.name }})
        run: cargo test --workspace ${{ matrix.features }}

      - name: Run clippy (${{ matrix.name }})
        run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build binary
        run: cargo build -p cli

      - name: Run E2E tests
        run: cargo test -p cli --test e2e

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings