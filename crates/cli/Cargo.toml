[package]
name = "cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gramps-gen"
path = "src/main.rs"

[dependencies]
typed-graph = { path = "../typed-graph" }
output = { path = "../output" }
gramps-reader = { path = "../gramps-reader" }
diff = { path = "../diff" }
delete = { path = "../delete" }
integrate = { path = "../integrate" }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
log = "0.4"
env_logger = "0.11"
quick-xml = "0.36"
ureq = "3"
flate2 = "1"

[dev-dependencies]
tempfile = "3"